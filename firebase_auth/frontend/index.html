<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in</title>
<style>
  :root {
    --navy: #1a2b4a;
    --navy-soft: #2c3f63;
    --gold: #b8943f;
    --gold-soft: #cdab5a;
    --cream: #f7f3ea;
    --line: #e4ddcc;
    --ink: #2a2a2a;
    --muted: #6b6f78;
    --danger: #b3261e;
    --fb: #1877f2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .card {
    max-width: 380px;
    margin: 0 auto;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 26px 24px;
    box-shadow: 0 1px 2px rgba(26,43,74,.05), 0 8px 28px rgba(26,43,74,.07);
  }
  .head { text-align: center; margin-bottom: 18px; }
  .head h1 {
    font-size: 19px;
    letter-spacing: .2px;
    color: var(--navy);
    margin: 0 0 4px;
    font-weight: 600;
  }
  .head p { margin: 0; font-size: 13px; color: var(--muted); }
  .rule {
    height: 2px; width: 38px; margin: 12px auto 0;
    background: var(--gold); border-radius: 2px;
  }
  button { font-family: inherit; cursor: pointer; }
  .social {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 11px 14px; margin-bottom: 10px;
    border-radius: 9px; font-size: 14px; font-weight: 500;
    border: 1px solid var(--line); background: #fff; color: #3c4043;
    transition: box-shadow .15s ease, transform .02s ease;
  }
  .social:hover { box-shadow: 0 2px 8px rgba(26,43,74,.10); }
  .social:active { transform: translateY(1px); }
  .social.fb { background: var(--fb); border-color: var(--fb); color: #fff; }
  .social svg { width: 18px; height: 18px; flex: 0 0 18px; }
  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12px; margin: 14px 2px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  label { display: block; font-size: 12px; color: var(--navy); margin: 10px 0 5px; font-weight: 500; }
  input[type=email], input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    outline: none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,148,63,.15); }
  .primary {
    width: 100%; margin-top: 14px; padding: 11px 14px;
    border: none; border-radius: 9px; background: var(--navy); color: #fff;
    font-size: 14px; font-weight: 600; letter-spacing: .2px;
    transition: background .15s ease, transform .02s ease;
  }
  .primary:hover { background: var(--navy-soft); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { opacity: .6; cursor: default; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .linkbtn {
    background: none; border: none; padding: 0; color: var(--navy);
    font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px;
  }
  .linkbtn:hover { color: var(--gold); }
  .msg { margin-top: 12px; font-size: 12.5px; min-height: 16px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: #2e7d32; }
  .signedin { text-align: center; padding: 8px 0; }
  .signedin .nm { color: var(--navy); font-weight: 600; font-size: 15px; }
  .signedin .em { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .social, .primary { transition: none; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <h1 id="title">Sign in to your portal</h1>
      <p id="subtitle">Use one of the options below to continue.</p>
      <div class="rule"></div>
    </div>

    <div id="authView">
      <button class="social" id="googleBtn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <button class="social fb" id="facebookBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="#fff">
          <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
        </svg>
        Continue with Facebook
      </button>

      <div class="divider">or use your email</div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />

      <button class="primary" id="emailBtn" type="button">Sign in</button>

      <div class="row">
        <button class="linkbtn" id="toggleMode" type="button">Create an account</button>
        <button class="linkbtn" id="resetBtn" type="button">Forgot password?</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>

    <div id="signedInView" class="signedin hidden">
      <div class="nm" id="siName"></div>
      <div class="em" id="siEmail"></div>
      <div class="msg ok">Signed in. Loading your portal…</div>
    </div>
  </div>

  <!-- Firebase Web SDK (compat build keeps this a single, no-build file) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script>
  // ---- Minimal Streamlit component protocol (no npm/React build needed) ----
  function sendToStreamlit(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  const Streamlit = {
    RENDER_EVENT: "streamlit:render",
    setComponentReady: function () { sendToStreamlit("streamlit:componentReady", { apiVersion: 1 }); },
    setFrameHeight: function (h) { sendToStreamlit("streamlit:setFrameHeight", { height: h }); },
    setComponentValue: function (v) { sendToStreamlit("streamlit:setComponentValue", { value: v }); },
    onRender: function (cb) {
      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === Streamlit.RENDER_EVENT) { cb(e.data.args || {}); }
      });
    }
  };

  function autoHeight() { Streamlit.setFrameHeight(document.body.scrollHeight + 8); }

  // ---- App state ----
  let initialized = false;
  let signupMode = false;
  let lastTokenSent = null;

  const $ = function (id) { return document.getElementById(id); };
  function showMsg(text, cls) {
    const m = $("msg");
    m.textContent = text || "";
    m.className = "msg" + (cls ? " " + cls : "");
    autoHeight();
  }
  function friendly(err) {
    const code = (err && err.code) || "";
    const map = {
      "auth/invalid-email": "That email address doesn't look right.",
      "auth/user-not-found": "No account found for that email.",
      "auth/wrong-password": "Incorrect email or password.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/email-already-in-use": "An account already exists for that email. Try signing in.",
      "auth/weak-password": "Use a password of at least 6 characters.",
      "auth/popup-blocked": "Your browser blocked the sign-in popup. Allow popups and try again.",
      "auth/popup-closed-by-user": "The sign-in window was closed before finishing.",
      "auth/account-exists-with-different-credential":
        "You've signed in before with a different method for this email. Use that method."
    };
    return map[code] || (err && err.message) || "Something went wrong. Please try again.";
  }

  function emitToken(user) {
    user.getIdToken().then(function (token) {
      if (token && token !== lastTokenSent) {
        lastTokenSent = token;
        $("authView").classList.add("hidden");
        $("siName").textContent = user.displayName || "";
        $("siEmail").textContent = user.email || "";
        $("signedInView").classList.remove("hidden");
        autoHeight();
        Streamlit.setComponentValue(token);
      }
    }).catch(function (err) { showMsg(friendly(err), "err"); });
  }

  function wireHandlers() {
    const auth = firebase.auth();

    $("googleBtn").onclick = function () {
      showMsg("", "");
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(function (err) { showMsg(friendly(err), "err"); });
    };

    $("facebookBtn").onclick = function () {
      showMsg("", "");
      auth.signInWithPopup(new firebase.auth.FacebookAuthProvider())
        .catch(function (err) { showMsg(friendly(err), "err"); });
    };

    $("emailBtn").onclick = function () {
      const email = $("email").value.trim();
      const pw = $("password").value;
      if (!email || !pw) { showMsg("Enter your email and password.", "err"); return; }
      showMsg("", "");
      $("emailBtn").disabled = true;
      const done = function () { $("emailBtn").disabled = false; };
      const op = signupMode
        ? auth.createUserWithEmailAndPassword(email, pw)
        : auth.signInWithEmailAndPassword(email, pw);
      op.then(function (cred) {
        if (signupMode && cred.user && !cred.user.emailVerified) {
          cred.user.sendEmailVerification().catch(function () {});
        }
        done();
      }).catch(function (err) { done(); showMsg(friendly(err), "err"); });
    };

    $("toggleMode").onclick = function () {
      signupMode = !signupMode;
      $("title").textContent = signupMode ? "Create your account" : "Sign in to your portal";
      $("emailBtn").textContent = signupMode ? "Create account" : "Sign in";
      $("toggleMode").textContent = signupMode ? "Have an account? Sign in" : "Create an account";
      $("password").setAttribute("autocomplete", signupMode ? "new-password" : "current-password");
      showMsg("", "");
    };

    $("resetBtn").onclick = function () {
      const email = $("email").value.trim();
      if (!email) { showMsg("Enter your email above, then tap reset.", "err"); return; }
      auth.sendPasswordResetEmail(email)
        .then(function () { showMsg("Password reset email sent.", "ok"); })
        .catch(function (err) { showMsg(friendly(err), "err"); });
    };

    // Picks up an existing session on refresh and emits the token automatically.
    auth.onAuthStateChanged(function (user) { if (user) { emitToken(user); } });
  }

  function init(config) {
    if (initialized) return;
    initialized = true;
    firebase.initializeApp(config);
    wireHandlers();
    autoHeight();
  }

  Streamlit.onRender(function (args) {
    const cfg = args.config || {};
    if (args.mode === "signout") {
      // Clear the persisted in-browser session, then report back.
      if (!initialized && cfg.apiKey) { firebase.initializeApp(cfg); initialized = true; }
      const finish = function () { lastTokenSent = null; Streamlit.setComponentValue("signed_out"); };
      try { firebase.auth().signOut().then(finish).catch(finish); }
      catch (e) { finish(); }
      $("card").classList.add("hidden");
      autoHeight();
      return;
    }
    if (cfg.apiKey) { init(cfg); }
    autoHeight();
  });

  Streamlit.setComponentReady();
  window.addEventListener("load", autoHeight);
  </script>
</body>
</html>
