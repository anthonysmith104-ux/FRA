name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (well under the 12-hour sleep limit)
  workflow_dispatch:         # lets you run it manually from the Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit the apps
        shell: python
        run: |
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://foresightpi.streamlit.app/",   # advisor app (Proposal Desk)
              "https://riskcheckup.streamlit.app/",   # client portal (Risk Checkup)
          ]
          WAKE_PHRASES = ["get this app back up", "Yes, get this app"]

          def visit(page, url):
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              except Exception as e:
                  print(f"ERR  {url}  ({e})")
                  return
              page.wait_for_timeout(4_000)
              woke = False
              for phrase in WAKE_PHRASES:
                  try:
                      btn = page.get_by_text(phrase, exact=False)
                      if btn.count() > 0:
                          btn.first.click()
                          woke = True
                          page.wait_for_timeout(20_000)
                          break
                  except Exception:
                      pass
              print(f"{'WOKE' if woke else 'OK  '} {url}")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              for u in URLS:
                  visit(page, u)
              browser.close()
