# ─────────────────────────────────────────────────────────────────────────
# Foresight Risk Advisor — Streamlit Cloud requirements
#
# Streamlit Cloud uses Python 3.14 as of May 2026. We use minimum-version
# constraints (>=) instead of strict pins (==) so pip can pick the latest
# wheel-available version for whatever Python the cloud runs. Strict pins
# caused build failures when the cloud upgraded Python and old wheels
# didn't exist for the new interpreter.
#
# Two specific things to know:
# 1) Pillow constraint: streamlit pulls in pillow<11; we let it choose
#    rather than pinning Pillow ourselves. Reportlab is happy with any
#    recent Pillow.
# 2) scipy + numpy: don't pin minor versions. They have to compile from
#    source if no wheel exists, and scipy needs gfortran for that —
#    Streamlit Cloud's build container doesn't include gfortran.
#
# Last verified: 2026-05-01
# ─────────────────────────────────────────────────────────────────────────

# Streamlit + UI
